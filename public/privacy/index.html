<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Chính sách bảo mật — Lumora</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #06060e; --accent: #8b5cf6; --text: #e2e8f0; --text-sub: rgba(255,255,255,0.6); --border: rgba(255,255,255,0.08); }
    body { background: var(--bg); color: var(--text); font-family: 'Jost', sans-serif; line-height: 1.7; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); }
    .nav-logo { font-size: 20px; color: var(--accent); }
    .nav-logo a { color: inherit; text-decoration: none; }
    .container { max-width: 800px; margin: 60px auto; padding: 0 40px; }
    h1 { font-size: 42px; margin-bottom: 12px; }
    .date { color: var(--text-sub); font-size: 14px; margin-bottom: 40px; }
    .privacy-control { padding:10px 16px; border:1px solid var(--accent); border-radius:8px; color:var(--text); background:rgba(139,92,246,.15); cursor:pointer; }
    h2 { font-size: 24px; margin-top: 40px; margin-bottom: 16px; color: var(--accent); }
    p { margin-bottom: 16px; color: var(--text-sub); }
    ul { margin-left: 24px; margin-bottom: 16px; }
    li { margin-bottom: 8px; color: var(--text-sub); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo"><a href="/">✦ Lumora</a></div>
  </nav>

  <div class="container">
    <h1 data-vi="Chính sách bảo mật" data-en="Privacy Policy"></h1>
    <div class="date" data-vi="Cập nhật lần cuối: 15/08/2026" data-en="Last updated: 15/08/2026"></div>

    <p data-vi="Lumora cam kết bảo vệ quyền riêng tư của bạn. Chính sách này giải thích cách chúng tôi thu thập, sử dụng và bảo vệ thông tin cá nhân của bạn."
       data-en="Lumora is committed to protecting your privacy. This policy explains how we collect, use, and protect your personal information."></p>

    <h2 data-vi="1. Thông tin chúng tôi thu thập" data-en="1. Information We Collect"></h2>
    <p><strong data-vi="Thông tin bạn cung cấp:" data-en="Information you provide:"></strong></p>
    <ul>
      <li data-vi="Email và mật khẩu khi đăng ký" data-en="Email and password when registering"></li>
      <li data-vi="Tên hiển thị và thông tin hồ sơ" data-en="Display name and profile information"></li>
      <li data-vi="Ảnh, âm nhạc và nội dung bạn tải lên" data-en="Photos, music, and content you upload"></li>
      <li data-vi="Mã đơn, gói, kỳ, số tiền, trạng thái và email người mua; PayOS xử lý thông tin phương tiện/tài khoản thanh toán và Lumora không lưu dữ liệu thẻ hoặc tài khoản ngân hàng đầy đủ" data-en="Order code, plan, term, amount, status, and buyer email; PayOS processes payment-method/account details and Lumora does not store full card or bank-account data"></li>
    </ul>
    <p><strong data-vi="Thông tin tự động thu thập:" data-en="Automatically collected information:"></strong></p>
    <ul>
      <li data-vi="Địa chỉ IP và thông tin thiết bị" data-en="IP address and device information"></li>
      <li data-vi="Dữ liệu sử dụng (tính năng bạn dùng, thời gian truy cập)" data-en="Usage data (features used, access times)"></li>
      <li data-vi="Dữ liệu lưu cục bộ trên trình duyệt, gồm phiên đăng nhập, ngôn ngữ, mã trình duyệt ngẫu nhiên, mã phiên activity và lựa chọn tắt tracking" data-en="Local browser storage, including login session, language, random browser ID, activity session ID, and tracking opt-out preference"></li>
      <li data-vi="Nhật ký tương tác và độ tin cậy: trang đã xem, nút/biểu mẫu đã dùng, kết quả thao tác, lỗi API/JavaScript/tài nguyên và thời lượng; gắn với mã trình duyệt ngẫu nhiên và mã phiên" data-en="Interaction and reliability logs: pages viewed, controls/forms used, operation results, API/JavaScript/resource errors and duration; linked to random browser and session identifiers"></li>
    </ul>

    <h2 data-vi="2. Cách chúng tôi sử dụng thông tin" data-en="2. How We Use Information"></h2>
    <p data-vi="Chúng tôi sử dụng thông tin của bạn để:" data-en="We use your information to:"></p>
    <ul>
      <li data-vi="Cung cấp và vận hành dịch vụ Lumora" data-en="Provide and operate the Lumora service"></li>
      <li data-vi="Xử lý thanh toán và quản lý đăng ký" data-en="Process payments and manage subscriptions"></li>
      <li data-vi="Gửi thông báo về tài khoản và cập nhật dịch vụ" data-en="Send account notifications and service updates"></li>
      <li data-vi="Cải thiện trải nghiệm người dùng" data-en="Improve user experience"></li>
      <li data-vi="Phát hiện và ngăn chặn gian lận, lạm dụng" data-en="Detect and prevent fraud and abuse"></li>
      <li data-vi="Tuân thủ nghĩa vụ pháp lý" data-en="Comply with legal obligations"></li>
    </ul>

    <h2 data-vi="3. Chia sẻ thông tin" data-en="3. Information Sharing"></h2>
    <p data-vi="Chúng tôi không bán thông tin cá nhân của bạn. Chúng tôi chỉ chia sẻ khi:"
       data-en="We do not sell your personal information. We only share when:"></p>
    <ul>
      <li><strong data-vi="Với sự đồng ý của bạn:" data-en="With your consent:"></strong> <span data-vi="Khi bạn chia sẻ Lumora công khai" data-en="When you share your Lumora publicly"></span></li>
      <li><strong data-vi="Nhà cung cấp dịch vụ:" data-en="Service providers:"></strong> <span data-vi="nhà cung cấp hạ tầng/lưu trữ, ImageKit để xử lý media, PayOS để xử lý thanh toán và Gmail để gửi email giao dịch" data-en="infrastructure and storage providers, ImageKit for media processing, PayOS for payments, and Gmail for transactional email"></span></li>
      <li><strong data-vi="Yêu cầu pháp lý:" data-en="Legal requirements:"></strong> <span data-vi="Khi luật pháp yêu cầu hoặc để bảo vệ quyền lợi hợp pháp" data-en="When required by law or to protect legal rights"></span></li>
      <li><strong data-vi="Chuyển giao kinh doanh:" data-en="Business transfer:"></strong> <span data-vi="Trong trường hợp sáp nhập hoặc mua lại" data-en="In the event of a merger or acquisition"></span></li>
    </ul>

    <h2 data-vi="4. Lưu trữ và bảo mật" data-en="4. Storage and Security"></h2>
    <p data-vi="Lumora áp dụng các biện pháp kỹ thuật hiện có trong ứng dụng để giảm rủi ro truy cập trái phép:"
       data-en="Lumora applies technical measures currently implemented in the application to reduce unauthorized-access risks:"></p>
    <ul>
      <li data-vi="Mã hóa dữ liệu khi truyền tải (HTTPS/TLS)" data-en="Data encryption in transit (HTTPS/TLS)"></li>
      <li data-vi="Mã hóa mật khẩu (bcrypt)" data-en="Password hashing (bcrypt)"></li>
      <li data-vi="Xác thực phiên và kiểm soát quyền truy cập theo tài khoản" data-en="Session authentication and account-based access control"></li>
      <li data-vi="Giới hạn tần suất đối với API nhạy cảm và tiêu đề bảo mật trình duyệt" data-en="Rate limiting for sensitive APIs and browser security headers"></li>
    </ul>
    <p data-vi="Tuy nhiên, không có hệ thống nào an toàn tuyệt đối. Chúng tôi khuyến khích bạn sử dụng mật khẩu mạnh và không chia sẻ thông tin đăng nhập."
       data-en="However, no system is completely secure. We encourage you to use strong passwords and not share your login credentials."></p>

    <h2 data-vi="5. Thời gian lưu trữ" data-en="5. Retention Period"></h2>
    <p data-vi="Chúng tôi lưu trữ thông tin của bạn:" data-en="We retain your information:"></p>
    <ul>
      <li data-vi="Trong suốt thời gian tài khoản còn hoạt động" data-en="For as long as your account is active"></li>
      <li data-vi="Dữ liệu tài khoản được xử lý theo chức năng xóa tài khoản; thời hạn lưu bổ sung, nếu có, phụ thuộc nghĩa vụ pháp lý áp dụng" data-en="Account data is handled through the account-deletion function; any additional retention depends on applicable legal obligations"></li>
      <li data-vi="Một số dữ liệu có thể được lưu lâu hơn để tuân thủ pháp luật" data-en="Some data may be retained longer to comply with legal obligations"></li>
      <li data-vi="Nhật ký hoạt động chi tiết được tự động xóa sau tối đa 180 ngày" data-en="Detailed activity logs are automatically deleted after no more than 180 days"></li>
    </ul>

    <h2 data-vi="6. Kiểm soát dữ liệu phân tích" data-en="6. Analytics Controls"></h2>
    <p data-vi="Lumora không dùng fingerprint phần cứng và không ghi mật khẩu, OTP, token, cookie, nội dung caption/story hoặc URL có chữ ký vào nhật ký hoạt động. Bạn có thể tắt hoặc bật lại activity tracking trên trình duyệt này bằng nút dưới đây. Các log bảo mật tối thiểu ở máy chủ vẫn có thể được lưu để chống lạm dụng."
       data-en="Lumora does not use hardware fingerprinting and does not record passwords, OTPs, tokens, cookies, caption/story content, or signed URLs in activity logs. You can disable or re-enable activity tracking in this browser below. Minimal server security logs may still be retained to prevent abuse."></p>
    <button type="button" class="privacy-control" id="tracking-toggle" data-track-action="Privacy Tracking Preference Click"></button>

    <h2 data-vi="7. Quyền của bạn" data-en="7. Your Rights"></h2>
    <p data-vi="Bạn có quyền:" data-en="You have the right to:"></p>
    <ul>
      <li><strong data-vi="Truy cập:" data-en="Access:"></strong> <span data-vi="Xem thông tin cá nhân chúng tôi có về bạn" data-en="View the personal information we hold about you"></span></li>
      <li><strong data-vi="Sửa đổi:" data-en="Rectification:"></strong> <span data-vi="Cập nhật thông tin không chính xác" data-en="Update inaccurate information"></span></li>
      <li><strong data-vi="Xóa:" data-en="Deletion:"></strong> <span data-vi="Yêu cầu xóa tài khoản và dữ liệu" data-en="Request deletion of your account and data"></span></li>
      <li><strong data-vi="Xuất dữ liệu:" data-en="Data portability:"></strong> <span data-vi="Tải về bản sao dữ liệu của bạn" data-en="Download a copy of your data"></span></li>
      <li><strong data-vi="Từ chối marketing:" data-en="Opt-out:"></strong> <span data-vi="Hủy đăng ký email quảng cáo" data-en="Unsubscribe from marketing emails"></span></li>
    </ul>
    <p data-vi="Để thực hiện các quyền này, gửi yêu cầu tại trang Hỗ trợ và chọn Quyền dữ liệu cá nhân."
       data-en="To exercise these rights, submit a Support request and select Personal Data Rights."></p>
    <p><a href="/support/?type=data_rights" data-vi="Gửi yêu cầu về dữ liệu" data-en="Submit a data request"></a></p>

    <h2 data-vi="8. Lưu trữ trình duyệt và analytics" data-en="8. Browser Storage and Analytics"></h2>
    <p data-vi="Lumora hiện sử dụng local storage của trình duyệt để:" data-en="Lumora currently uses browser local storage to:"></p>
    <ul>
      <li data-vi="Duy trì phiên đăng nhập" data-en="Maintain login sessions"></li>
      <li data-vi="Ghi nhớ tùy chọn của bạn" data-en="Remember your preferences"></li>
      <li data-vi="Duy trì mã trình duyệt/mã phiên ngẫu nhiên cho hệ thống activity nội bộ" data-en="Maintain random browser/session IDs for the internal activity system"></li>
    </ul>
    <p data-vi="Lumora không tích hợp nền tảng analytics quảng cáo của bên thứ ba trong source hiện tại. Xóa local storage có thể đăng xuất tài khoản và đặt lại tùy chọn."
       data-en="Lumora does not integrate a third-party advertising analytics platform in the current source. Clearing local storage may sign you out and reset preferences."></p>

    <h2 data-vi="9. Trẻ em" data-en="9. Children"></h2>
    <p data-vi="Lumora không dành cho trẻ dưới 13 tuổi. Chúng tôi không cố ý thu thập thông tin từ trẻ em. Nếu bạn phát hiện trẻ em sử dụng dịch vụ, vui lòng thông báo để chúng tôi xử lý."
       data-en="Lumora is not intended for children under 13. We do not knowingly collect information from children. If you discover a child using the service, please notify us."></p>

    <h2 data-vi="10. Chuyển dữ liệu quốc tế" data-en="10. International Data Transfers"></h2>
    <p data-vi="Một số nhà cung cấp dịch vụ có thể xử lý dữ liệu ngoài Việt Nam theo hạ tầng của họ. Lumora lựa chọn và cấu hình nhà cung cấp trong phạm vi kỹ thuật khả dụng, đồng thời áp dụng yêu cầu bảo vệ dữ liệu phù hợp với vai trò của từng bên."
       data-en="Some service providers may process data outside Vietnam through their infrastructure. Lumora selects and configures providers within available technical controls and applies data-protection requirements appropriate to each provider’s role."></p>

    <h2 data-vi="11. Thay đổi chính sách" data-en="11. Policy Changes"></h2>
    <p data-vi="Chúng tôi có thể cập nhật chính sách này. Thay đổi quan trọng sẽ được thông báo qua email hoặc thông báo trên trang web trước ít nhất 7 ngày."
       data-en="We may update this policy. Important changes will be notified via email or on the website at least 7 days in advance."></p>

    <h2 data-vi="12. Liên hệ" data-en="12. Contact"></h2>
    <p data-vi="Nếu có câu hỏi hoặc khiếu nại về dữ liệu, gửi yêu cầu qua trang Hỗ trợ và khiếu nại."
       data-en="For data questions or complaints, submit a request through the Support and Complaints page."></p>
    <p><a href="/support/?type=data_rights" data-vi="Mở trang hỗ trợ" data-en="Open support page"></a></p>
  </div>

  <script src="/shared/js/activityApi.js"></script>
  <script src="/shared/js/activityLogger.js"></script>
  <script src="/shared/js/trackedFetch.js"></script>
  <script src="/shared/js/activityAutoTracker.js"></script>
  <script src="/shared/js/i18n.js"></script>
  <script src="/shared/js/publicSite.js"></script>
  <script>
    const lang = localStorage.getItem('lang') || ((navigator.language || '').startsWith('en') && !navigator.languages?.some(l => l.startsWith('vi')) ? 'en' : 'vi');
    document.querySelectorAll('[data-vi]').forEach(el => {
      el.textContent = lang === 'en' ? el.dataset.en : el.dataset.vi;
    });
    if (lang === 'en') {
      document.title = 'Privacy Policy — Lumora';
      document.documentElement.lang = 'en';
    }
    const trackingToggle = document.getElementById('tracking-toggle');
    function renderTrackingPreference() {
      const optedOut = localStorage.getItem('lumora_tracking_opt_out') === 'true';
      trackingToggle.textContent = lang === 'en'
        ? (optedOut ? 'Enable activity tracking' : 'Disable activity tracking')
        : (optedOut ? 'Bật activity tracking' : 'Tắt activity tracking');
    }
    trackingToggle.addEventListener('click', () => {
      const optedOut = localStorage.getItem('lumora_tracking_opt_out') === 'true';
      localStorage.setItem('lumora_tracking_opt_out', optedOut ? 'false' : 'true');
      renderTrackingPreference();
      if (optedOut) setTimeout(() => location.reload(), 50);
    });
    renderTrackingPreference();
  </script>
</body>
</html>
