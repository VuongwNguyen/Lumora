<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>Lumora — Story Experience</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Alias sang tokens.css — giữ tên biến cũ để mọi chỗ dùng var() tự đúng.
     * --emotion-accent KHÔNG ở đây: nó đến từ config/storyEmotions.js, là màu
     * của cảm xúc câu chuyện chứ không phải màu sản phẩm. */
    :root {
      --accent: var(--lum-son);
      --accent-light: var(--lum-dong);
      --accent-dim: var(--lum-son-mo);
      --accent-border: var(--lum-vien-manh);
      --text: var(--lum-trung);
      --text-sub: var(--lum-trung-mo);
      --border: var(--lum-vien);
      --glass: rgba(30, 28, 26,0.95);
      --panel-w: 380px;
      --r: 14px;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Jost', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex; background: var(--lum-nen);
    }

    /* ── SE Preview pane ── */
    #preview-pane {
      flex: 1; position: relative; overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 80% 55% at 50% 10%, rgba(158,68,56,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(185,154,94,0.10) 0%, transparent 60%),
        var(--lum-nen);
    }

    /* Photo background layer */
    #preview-photos {
      position: absolute; inset: 0; z-index: 1;
    }
    .preview-memory-root {
      position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease;
    }
    .preview-memory-blur {
      position: absolute; inset: -30px;
      background-size: cover; background-position: center;
      filter: blur(24px) brightness(0.24) saturate(.72);
      transform: scale(1.08);
    }
    .preview-memory-camera { position:absolute; inset:0; }
    .preview-memory-frame {
      position:absolute; width:34%; aspect-ratio:4/5;
      overflow:hidden; border:1px solid rgba(232,220,204,.16); border-radius:3px;
      background:rgba(232,220,204,.05); box-shadow:0 16px 44px rgba(0,0,0,.55);
      transform:rotate(var(--preview-rotate,0deg));
    }
    .preview-memory-frame img { width:100%; height:100%; display:block; object-fit:cover; }
    .preview-scene-spotlight .preview-memory-frame:first-child {
      width:min(44%, 540px); height:min(66%, 700px); left:50%; top:45%;
      transform:translate(-50%,-50%) rotate(-.5deg);
      border-color:rgba(232,220,204,.22); border-radius:10px;
      background:rgba(3,3,9,.72); box-shadow:0 30px 90px rgba(0,0,0,.62), 0 0 0 1px rgba(232,220,204,.035);
    }
    .preview-scene-spotlight .preview-memory-frame:first-child img { object-fit:contain; }
    .preview-scene-constellation .preview-memory-frame:nth-child(1),
    .preview-scene-crescendo .preview-memory-frame:nth-child(1) { left:2%; top:8%; --preview-rotate:-5deg; }
    .preview-scene-constellation .preview-memory-frame:nth-child(2),
    .preview-scene-crescendo .preview-memory-frame:nth-child(2) { right:2%; top:7%; --preview-rotate:5deg; }
    .preview-scene-constellation .preview-memory-frame:nth-child(3) { left:34%; top:34%; z-index:3; }
    .preview-scene-constellation .preview-memory-frame:nth-child(4) { right:3%; bottom:2%; --preview-rotate:5deg; }
    .preview-scene-constellation .preview-memory-frame:nth-child(5) { left:4%; bottom:1%; --preview-rotate:-5deg; }
    .preview-scene-crescendo .preview-memory-frame:nth-child(3) { width:52%; height:72%; left:50%; top:50%; transform:translate(-50%,-50%); z-index:4; }
    .preview-scene-crescendo .preview-memory-frame:nth-child(4) { left:3%; bottom:1%; --preview-rotate:5deg; }
    .preview-scene-crescendo .preview-memory-frame:nth-child(5) { right:3%; bottom:1%; --preview-rotate:-5deg; }
    .preview-scene-horizon .preview-memory-frame { width:48%; left:50%; top:50%; transform:translate(-50%,-50%); }
    .preview-scene-horizon .preview-memory-frame:nth-child(1) { transform:translate(-58%,-50%) rotate(-5deg); opacity:.52; }
    .preview-scene-horizon .preview-memory-frame:last-child { transform:translate(-44%,-50%) rotate(4deg); z-index:3; }
    .preview-scene-cascade .preview-memory-frame { width:38%; height:58%; top:21%; }
    .preview-scene-cascade .preview-memory-frame:nth-child(1) { left:5%; --preview-rotate:-6deg; opacity:.52; }
    .preview-scene-cascade .preview-memory-frame:nth-child(2) { left:20%; top:17%; --preview-rotate:-3deg; opacity:.72; z-index:2; }
    .preview-scene-cascade .preview-memory-frame:nth-child(3) { left:36%; top:13%; z-index:4; }
    .preview-scene-cascade .preview-memory-frame:nth-child(4) { right:11%; top:18%; --preview-rotate:3deg; opacity:.72; z-index:3; }
    .preview-scene-cascade .preview-memory-frame:nth-child(5) { right:2%; top:23%; --preview-rotate:6deg; opacity:.5; }

    /* Emotion scenes use count-aware geometry from the shared Director. */
    .preview-scene-directed .preview-memory-camera::before {
      content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
      opacity:.9;
    }
    .preview-scene-directed .preview-memory-frame {
      width:var(--scene-w); height:var(--scene-h);
      left:var(--scene-x); top:var(--scene-y);
      right:auto; bottom:auto; opacity:var(--scene-opacity); z-index:var(--scene-z);
      transform:translate(-50%,-50%) rotate(var(--scene-rotate));
      border-radius:var(--scene-radius,5px);
    }
    .preview-scene-embrace { --scene-radius:12px; }
    .preview-scene-embrace .preview-memory-camera::before {
      background:radial-gradient(ellipse at 50% 48%,rgba(244,177,131,.24),transparent 48%),linear-gradient(90deg,rgba(20,9,9,.36),transparent 30% 70%,rgba(20,9,9,.36));
    }
    .preview-scene-duet { --scene-radius:10px; }
    .preview-scene-duet .preview-memory-camera::before {
      background:radial-gradient(circle at 29% 50%,rgba(240,154,192,.18),transparent 30%),radial-gradient(circle at 71% 50%,rgba(240,154,192,.18),transparent 30%),linear-gradient(90deg,transparent 49.7%,rgba(232,220,204,.07) 50%,transparent 50.3%);
    }
    .preview-scene-archive { --scene-radius:3px; }
    .preview-scene-archive .preview-memory-camera::before {
      background:repeating-linear-gradient(90deg,rgba(232,220,204,.035) 0 1px,transparent 1px 12%),linear-gradient(180deg,rgba(37,25,44,.12),rgba(10,7,15,.42));
    }
    .preview-scene-stillness .preview-memory-camera::before {
      background:radial-gradient(ellipse at 50% 48%,rgba(143,164,202,.13),transparent 34%),linear-gradient(90deg,rgba(1,4,12,.56),transparent 38% 62%,rgba(1,4,12,.56));
    }
    .preview-scene-stillness .preview-memory-frame:not(:first-child) { filter:saturate(.55); }
    .preview-scene-orbit { --scene-radius:9px; }
    .preview-scene-orbit .preview-memory-camera::before {
      background:radial-gradient(circle at 50% 48%,transparent 0 23%,rgba(121,217,242,.11) 23.3% 23.8%,transparent 24.2% 39%,rgba(121,217,242,.06) 39.3% 39.7%,transparent 40%);
    }
    .preview-scene-ascent { --scene-radius:7px; }
    .preview-scene-ascent .preview-memory-camera::before {
      background:linear-gradient(155deg,rgba(4,12,12,.36) 8%,transparent 45%,rgba(143,227,189,.16) 82%,rgba(218,247,229,.12)),linear-gradient(0deg,rgba(143,227,189,.1),transparent 58%);
    }

    /* Bottom text overlay — mirrors SE viewer */
    #se-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      padding: 80px 36px 36px;
      background: linear-gradient(to top, rgba(4,4,12,0.95) 0%, rgba(4,4,12,0.6) 50%, transparent 100%);
      pointer-events: none;
    }
    #se-bottom-label {
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(232,220,204,0.5); font-family: 'Jost', sans-serif;
      margin-bottom: 12px;
    }
    #se-bottom-hook {
      font-family: 'Georgia', serif; font-style: italic;
      font-size: clamp(17px, 2.2vw, 26px);
      color: var(--lum-trung); line-height: 1.55;
      text-shadow: 0 1px 12px rgba(0,0,0,0.6);
    }

    /* Canvas effect layer — subtle on top of photo */
    #se-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
      opacity: 0.4;
    }

    /* CSS stars */
    .se-star {
      position: absolute; border-radius: 50%; background: var(--lum-trung);
      animation: twinkle var(--d, 3s) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: var(--min, 0.05); }
      50%      { opacity: var(--max, 0.4); }
    }

    /* Center preview text */
    #se-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    /* Hide center overlay when photo is shown */
    #preview-pane.has-photo #se-center { opacity: 0; }
    #preview-pane.has-photo #se-bottom {
      top:auto; bottom:clamp(22px,4.5vh,52px); left:50%; right:auto;
      width:min(calc(100% - 48px),720px); padding:17px 20px 18px;
      transform:translateX(-50%); text-align:left; opacity:1;
      border:1px solid rgba(232,220,204,.105); border-radius:16px;
      background:linear-gradient(145deg,rgba(5,5,13,.82),rgba(11,8,24,.68));
      box-shadow:0 18px 60px rgba(0,0,0,.38); backdrop-filter:blur(18px);
    }
    #preview-label {
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(232,220,204,0.25); font-family: 'Jost', sans-serif;
      margin-bottom: 20px;
    }
    #preview-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 4.5vw, 58px);
      font-weight: 400; letter-spacing: 0.08em;
      color: rgba(240,236,228,0.88); line-height: 1.1;
      margin-bottom: 12px;
    }
    #preview-occasion {
      font-size: 11px; color: rgba(232,220,204,0.28);
      letter-spacing: 0.2em; text-transform: uppercase;
      font-family: 'Jost', sans-serif; margin-bottom: 40px;
    }
    .se-pulse-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    .se-pulse {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(232,220,204,0.2);
      animation: sePulse 2.2s ease-out infinite;
    }
    @keyframes sePulse {
      0%   { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Toggle */
    #panel-toggle {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      width: 20px; height: 52px;
      background: rgba(4,4,12,0.92);
      border: 1px solid var(--accent-border); border-right: none;
      border-radius: 8px 0 0 8px;
      cursor: pointer; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-light); font-size: 10px;
      transition: background 0.2s;
    }
    #panel-toggle:hover { background: var(--lum-son); }

    /* ── Story panel ── */
    #story-panel {
      width: var(--panel-w); height: 100vh; flex-shrink: 0;
      background: var(--glass);
      border-left: 1px solid var(--accent-border);
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease, border-color 0.3s ease;
    }
    #story-panel.collapsed { width: 0; border-color: transparent; }

    .panel-header { order:0; }
    .story-mobile-tabs { display:none; order:1; }
    .chat-wrap { order:2; }
    .emotion-director { order:3; }

    /* Panel header */
    .panel-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-btn {
      font-size: 12px; color: var(--text-sub); text-decoration: none;
      letter-spacing: 0.05em; transition: color 0.2s;
      display: inline-block; margin-bottom: 10px;
    }
    .back-btn:hover { color: var(--text); }
    .header-eyebrow {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent-light); opacity: 0.7; margin-bottom: 4px;
    }
    #galaxy-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #galaxy-name-button {
      width: 100%; min-width: 0; padding: 3px 6px; margin: -3px -6px;
      display: flex; align-items: center; gap: 7px;
      color: var(--text); background: transparent; border: 1px solid transparent;
      border-radius: 5px; text-align: left; cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    #galaxy-name-button:hover, #galaxy-name-button:focus-visible {
      background: var(--lum-son-mo); border-color: var(--lum-dong);
      outline: none;
    }
    #galaxy-name-button .edit-icon { opacity: 0; flex-shrink: 0; font-size: 12px; color: var(--accent-light); }
    #galaxy-name-button:hover .edit-icon, #galaxy-name-button:focus-visible .edit-icon { opacity: 0.8; }
    #galaxy-name-input {
      width: 100%; padding: 2px 6px; margin: -3px -6px;
      font: 600 20px 'Cormorant Garamond', serif; color: var(--text);
      background: var(--lum-son-mo); border: 1px solid var(--lum-dong);
      border-radius: 5px; outline: none;
    }
    #galaxy-name-status { min-height: 14px; margin-top: 4px; font-size: 11px; color: var(--text-sub); }
    #galaxy-name-status.error { color: var(--lum-loi); }

    /* Chat */
    .chat-wrap {
      flex: 1; overflow-y: auto;
      padding: 20px 16px 32px;
      display: flex; flex-direction: column;
    }
    .emotion-director {
      flex-shrink: 0;
      border-bottom: 1px solid rgba(232,220,204,.065);
      background: linear-gradient(145deg, var(--lum-son-mo), rgba(232,220,204,.012));
    }
    .emotion-director summary {
      min-height: 43px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(232,220,204,.74);
      cursor: pointer;
      list-style: none;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .emotion-director summary::-webkit-details-marker { display: none; }
    .emotion-director summary::after { content: '⌄'; color: var(--accent-light); transition: transform .2s ease; }
    .emotion-director[open] summary::after { transform: rotate(180deg); }
    .emotion-director summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
    .emotion-director-body { padding: 0 22px 16px; }
    .emotion-director-copy { margin-bottom: 11px; color: rgba(232,220,204,.38); font-size: 10px; line-height: 1.5; }
    .emotion-auto {
      width: 100%; min-height: 42px; padding: 9px 11px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid rgba(185,154,94,.16); border-radius: 11px;
      background: rgba(158,68,56,.045); color: rgba(232,220,204,.7);
      font: 500 11px 'Jost',sans-serif; text-align: left; cursor: pointer;
    }
    .emotion-auto span:last-child { color: var(--lum-trung-nhat); font-size: 9px; font-weight: 400; }
    .emotion-auto[aria-pressed="true"] { border-color: var(--lum-dong); background: var(--lum-son-mo); color: var(--lum-trung); }
    .emotion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .emotion-card {
      min-width: 0; min-height: 54px; padding: 9px 10px;
      border: 1px solid rgba(232,220,204,.07); border-radius: 11px;
      background: rgba(232,220,204,.018); color: rgba(232,220,204,.66);
      font: 500 10px 'Jost',sans-serif; text-align: left; cursor: pointer;
    }
    .emotion-card small { display: block; margin-top: 3px; overflow: hidden; color: rgba(232,220,204,.3); font-size: 8px; font-weight: 300; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .emotion-card:hover, .emotion-card:focus-visible { outline: none; border-color: color-mix(in srgb, var(--emotion-accent, var(--lum-dong)) 58%, transparent); color: var(--lum-trung); }
    .emotion-card[aria-pressed="true"] { border-color: var(--emotion-accent, var(--lum-dong)); background: color-mix(in srgb, var(--emotion-accent, var(--lum-dong)) 14%, transparent); color: var(--lum-trung); }
    .emotion-intensity { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; margin-top: 13px; color: rgba(232,220,204,.46); font-size: 10px; }
    .emotion-intensity output { color: var(--accent-light); font-variant-numeric: tabular-nums; }
    .emotion-intensity input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
    .emotion-actions { display: flex; align-items: center; gap: 9px; margin-top: 12px; }
    .emotion-preview {
      min-height: 34px; padding: 7px 11px; border: 1px solid rgba(185,154,94,.28); border-radius: 9px;
      background: rgba(158,68,56,.1); color: var(--accent-light); font: 500 10px 'Jost',sans-serif; cursor: pointer;
    }
    .emotion-preview:disabled { opacity: .45; cursor: wait; }
    .emotion-preview[hidden] { display:none; }
    .emotion-finish {
      min-height:34px; margin-left:auto; padding:7px 12px; border:1px solid rgba(185,154,94,.42); border-radius:9px;
      background:var(--lum-son); color:var(--lum-trung); font:500 10px 'Jost',sans-serif; cursor:pointer;
    }
    .emotion-finish:disabled { opacity:.48; cursor:wait; }
    .emotion-status { min-width: 0; color: rgba(232,220,204,.35); font-size: 9px; line-height: 1.35; }
    .emotion-status.error { color: var(--lum-loi); }
    .chat-wrap::-webkit-scrollbar { width: 3px; }
    .chat-wrap::-webkit-scrollbar-thumb { background: var(--accent-border); border-radius: 2px; }

    /* ── Chat elements ── */
    .lmsg { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
    .av {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: var(--lum-son);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: rgba(232,220,204,0.85); margin-top: 2px;
    }
    .lbubble {
      background: var(--accent-dim);
      border: 1px solid rgba(158,68,56,0.18);
      border-radius: 3px 14px 14px 14px;
      padding: 11px 15px; font-size: 13px; line-height: 1.75;
      color: rgba(232,220,204,0.82); max-width: 90%;
    }
    .lbubble em { color: var(--accent-light); font-style: italic; }
    .err-bubble { background: rgba(217,96,74,0.12); border-color: rgba(217,96,74,0.35); color: var(--lum-loi); }

    .typing-dots {
      display: flex; gap: 5px; align-items: center;
      padding: 12px 16px;
      background: rgba(158,68,56,0.07);
      border: 1px solid rgba(158,68,56,0.12);
      border-radius: 3px 14px 14px 14px;
    }
    .typing-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(158,68,56,0.55);
      animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .umsg { display: flex; margin-bottom: 14px; justify-content: flex-end; }
    .ububble {
      background: rgba(232,220,204,0.07);
      border: 1px solid rgba(232,220,204,0.1);
      border-radius: 14px 3px 14px 14px;
      padding: 10px 15px; font-size: 13px;
      color: rgba(232,220,204,0.6); max-width: 80%;
    }

    .chips-wrap { margin: 2px 0 14px 38px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 16px; border-radius: 24px;
      background: rgba(158,68,56,0.07);
      border: 1px solid rgba(158,68,56,0.22);
      font-size: 12px; color: var(--lum-dong);
      cursor: pointer; transition: all 0.18s;
    }
    .chip:hover { background: var(--lum-son-mo); border-color: var(--lum-dong); color: var(--accent-light); }
    .chip.on { background: var(--lum-son); border-color: var(--lum-dong); color: var(--lum-trung); }

    .ch-card {
      margin: 4px 0 10px 38px;
      border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(158,68,56,0.15);
      background: rgba(158,68,56,0.05);
      backdrop-filter: blur(4px);
    }
    .ch-head {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(232,220,204,0.05);
    }
    .ch-num { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lum-trung-nhat); margin-bottom: 2px; }
    .ch-title { font-size: 13px; color: rgba(232,220,204,0.85); font-weight: 400; }
    .ch-photos { padding: 10px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .ch-ph {
      width: 48px; height: 48px; border-radius: 8px;
      background: rgba(232,220,204,0.03);
      border: 1px dashed rgba(158,68,56,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: rgba(232,220,204,0.18);
      cursor: pointer; overflow: hidden; flex-shrink: 0;
      transition: border-color 0.2s, background 0.2s;

<body>

  <!-- SE Visual Preview -->
  <div id="preview-pane">

  <script>
    document.documentElement.lang = userLang;
    document.title = t.storySetupPageTitle || document.title;
    document.querySelectorAll('[data-i18n]').forEach(function (node) {
      const value = t[node.dataset.i18n];

    document.querySelectorAll('[data-i18n-label]').forEach(function (node) {
      const value = t[node.dataset.i18nLabel];
      if (typeof value === 'string') node.setAttribute('aria-label', value);
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function (node) {
      const value = t[node.dataset.i18nTitle];
      if (typeof value === 'string') node.title = value;
    });

    // ── CSS Stars ──────────────────────────────────────────
    const pane = document.getElementById('preview-pane');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'se-star';
      const sz = Math.random() * 1.8 + 0.3;
      s.style.cssText = `
        width:${sz}px;height:${sz}px;
        left:${Math.random()*100}%;top:${Math.random()*100}%;
        --d:${2+Math.random()*5}s;
        --min:${0.03+Math.random()*0.06};
        --max:${0.25+Math.random()*0.4};
        animation-delay:${Math.random()*5}s;
      `;
      pane.appendChild(s);
    }

    // ── Preview text update (called from story-setup.js) ───
    window.updateSEPreview = function(type, occasion, galaxyName) {
      if (galaxyName) document.getElementById('preview-name').textContent = galaxyName;
      if (occasion)   document.getElementById('preview-occasion').textContent = occasion.toUpperCase();
    };

    // ── Memory Scene preview: one chapter is one spatial composition ──

    function showMemoryScene(urls, direction = {}) {
      const pane   = document.getElementById('preview-pane');
      const wrap   = document.getElementById('preview-photos');
      const center = document.getElementById('se-center');

      if (!urls.length) {
        pane.classList.remove('has-photo');
        center.style.removeProperty('opacity'); // let CSS take over
        [...wrap.children].forEach(c => { c.style.opacity = '0'; setTimeout(() => c.remove(), 1000); });
        return;
      }

      const role = direction.role || (urls.length >= 4 ? 'climax' : (urls.length === 1 ? 'intro' : 'memory'));
      const composition = direction.composition || window.LumoraStoryEmotion?.resolveSceneComposition(role, urls.length)
        || (urls.length >= 4 ? 'crescendo' : (urls.length === 1 ? 'spotlight' : 'constellation'));
      const sceneUrls = urls.slice(0, 5);
      const frameLayout = window.LumoraStoryEmotion?.resolveSceneFrameLayout(composition, sceneUrls.length) || [];
      const scene = document.createElement('div');
      scene.className = `preview-memory-root preview-scene-${composition}${frameLayout.length ? ' preview-scene-directed' : ''}`;
      const blur = document.createElement('div');
      blur.className = 'preview-memory-blur';
      blur.style.backgroundImage = `url(${JSON.stringify(urls[Math.min(2, urls.length - 1)])})`;
      const camera = document.createElement('div');
      camera.className = 'preview-memory-camera';
      sceneUrls.forEach((url, index) => {
        const frame = document.createElement('div');
        frame.className = 'preview-memory-frame';
        const frameDirection = frameLayout[index];
        if (frameDirection) {
          frame.style.setProperty('--scene-x', `${frameDirection.x}%`);
          frame.style.setProperty('--scene-y', `${frameDirection.y}%`);
          frame.style.setProperty('--scene-w', `${frameDirection.width}%`);
          frame.style.setProperty('--scene-h', `${frameDirection.height}%`);
          frame.style.setProperty('--scene-rotate', `${frameDirection.rotate}deg`);
          frame.style.setProperty('--scene-opacity', frameDirection.opacity);
          frame.style.setProperty('--scene-z', frameDirection.z);
        }
        const image = document.createElement('img');
        image.src = url;
        image.alt = '';
        frame.appendChild(image);
        camera.appendChild(frame);
      });
      scene.append(blur, camera);
      wrap.appendChild(scene);

      pane.classList.add('has-photo');
      center.style.removeProperty('opacity'); // CSS class handles hiding

      requestAnimationFrame(() => requestAnimationFrame(() => {
        scene.style.opacity = '0.94';
        [...wrap.children].forEach(c => {
          if (c === scene) return;
          c.style.opacity = '0';
          setTimeout(() => c.remove(), 1100);
        });
      }));
    }

    let _previewGen = 0; // generation counter — cancels stale async calls

    function startChapterPreview(urls, direction) {
      showMemoryScene(urls, direction);
    }

    // From server URLs (sync — always wins over any in-flight async)
    window.setPreviewPhotoUrls = (urls, direction) => {
      _previewGen++; // invalidate any in-flight setPreviewPhotos call
      startChapterPreview(urls || [], direction);
    };

    // From file select — use FileReader (data: URLs pass CSP; blob: URLs do not)
    window.setPreviewPhotos = async files => {
      const myGen = ++_previewGen;
      const urls = await Promise.all(Array.from(files).map(f => new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(f);
      })));
      if (myGen !== _previewGen) return; // stale — a newer chapter took over
      startChapterPreview(urls);
    };

    // ── Panel toggle ───────────────────────────────────────
    document.getElementById('panel-toggle').onclick = function() {
      const panel = document.getElementById('story-panel');
      const collapsed = panel.classList.toggle('collapsed');
      this.textContent = collapsed ? '▶' : '◀';
      this.setAttribute('aria-expanded', String(!collapsed));
      this.setAttribute('aria-label', collapsed ? t.storySetupPanelShow : t.storySetupPanelHide);
      this.title = collapsed ? t.storySetupPanelShow : t.storySetupPanelHide;
    };

    // Mobile is a guided two-step workspace instead of a compressed desktop editor.
    const storyPanel = document.getElementById('story-panel');
    const mobileStoryTabs = [...document.querySelectorAll('.story-mobile-tab')];
    function setMobileStorySection(section, moveFocus) {
      storyPanel.dataset.mobileSection = section;
      mobileStoryTabs.forEach(tab => {
        const selected = tab.dataset.mobileSection === section;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
        if (selected && moveFocus) tab.focus();
      });
      if (section === 'story') requestAnimationFrame(() => document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight);
    }
    mobileStoryTabs.forEach((tab, index) => {
      tab.addEventListener('click', () => setMobileStorySection(tab.dataset.mobileSection, false));
      tab.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const next = mobileStoryTabs[(index + direction + mobileStoryTabs.length) % mobileStoryTabs.length];
        setMobileStorySection(next.dataset.mobileSection, true);
      });
    });
    setMobileStorySection('story', false);
  </script>
