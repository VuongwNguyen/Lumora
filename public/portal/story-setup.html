<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>Lumora — Story Experience</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #8b5cf6;
      --accent-light: #c4b5fd;
      --accent-dim: rgba(139,92,246,0.1);
      --accent-border: rgba(139,92,246,0.28);
      --text: #ede9f8;
      --text-sub: rgba(237,233,248,0.42);
      --border: rgba(255,255,255,0.06);
      --glass: rgba(4,4,12,0.95);
      --panel-w: 380px;
      --r: 14px;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Jost', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex; background: #060610;
    }

    /* ── SE Preview pane ── */
    #preview-pane {
      flex: 1; position: relative; overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 80% 55% at 50% 10%, rgba(109,40,217,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(30,60,160,0.1) 0%, transparent 60%),
        #060610;
    }

    /* Photo background layer */
    #preview-photos {
      position: absolute; inset: 0; z-index: 1;
    }
    .preview-photo-bg {
      position: absolute; inset: 0;
      opacity: 0; transition: opacity 1s ease;
    }
    .preview-photo-bg .ph-blur {
      position: absolute; inset: -30px;
      background-size: cover; background-position: center;
      filter: blur(24px) brightness(0.35);
      transform: scale(1.08);
    }
    .preview-photo-bg img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* Bottom text overlay — mirrors SE viewer */
    #se-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      padding: 80px 36px 36px;
      background: linear-gradient(to top, rgba(4,4,12,0.95) 0%, rgba(4,4,12,0.6) 50%, transparent 100%);
      pointer-events: none;
    }
    #se-bottom-label {
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.5); font-family: 'Jost', sans-serif;
      margin-bottom: 12px;
    }
    #se-bottom-hook {
      font-family: 'Georgia', serif; font-style: italic;
      font-size: clamp(17px, 2.2vw, 26px);
      color: #fff; line-height: 1.55;
      text-shadow: 0 1px 12px rgba(0,0,0,0.6);
    }

    /* Canvas effect layer — subtle on top of photo */
    #se-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
      opacity: 0.4;
    }

    /* CSS stars */
    .se-star {
      position: absolute; border-radius: 50%; background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: var(--min, 0.05); }
      50%      { opacity: var(--max, 0.4); }
    }

    /* Center preview text */
    #se-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    /* Hide center overlay when photo is shown */
    #preview-pane.has-photo #se-center { opacity: 0; }
    #preview-pane.has-photo #se-bottom { opacity: 1; }
    #preview-label {
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.25); font-family: 'Jost', sans-serif;
      margin-bottom: 20px;
    }
    #preview-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 4.5vw, 58px);
      font-weight: 400; letter-spacing: 0.08em;
      color: rgba(240,236,228,0.88); line-height: 1.1;
      margin-bottom: 12px;
      text-shadow: 0 0 40px rgba(139,92,246,0.3);
    }
    #preview-occasion {
      font-size: 11px; color: rgba(255,255,255,0.28);
      letter-spacing: 0.2em; text-transform: uppercase;
      font-family: 'Jost', sans-serif; margin-bottom: 40px;
    }
    .se-pulse-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    .se-pulse {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      animation: sePulse 2.2s ease-out infinite;
    }
    @keyframes sePulse {
      0%   { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Toggle */
    #panel-toggle {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      width: 20px; height: 52px;
      background: rgba(4,4,12,0.92);
      border: 1px solid var(--accent-border); border-right: none;
      border-radius: 8px 0 0 8px;
      cursor: pointer; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-light); font-size: 10px;
      transition: background 0.2s;
    }
    #panel-toggle:hover { background: rgba(139,92,246,0.2); }

    /* ── Story panel ── */
    #story-panel {
      width: var(--panel-w); height: 100vh; flex-shrink: 0;
      background: var(--glass);
      border-left: 1px solid var(--accent-border);
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease, border-color 0.3s ease;
    }
    #story-panel.collapsed { width: 0; border-color: transparent; }

    /* Panel header */
    .panel-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-btn {
      font-size: 12px; color: var(--text-sub); text-decoration: none;
      letter-spacing: 0.05em; transition: color 0.2s;
      display: inline-block; margin-bottom: 10px;
    }
    .back-btn:hover { color: var(--text); }
    .header-eyebrow {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent-light); opacity: 0.7; margin-bottom: 4px;
    }
    #galaxy-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #galaxy-name-button {
      width: 100%; min-width: 0; padding: 3px 6px; margin: -3px -6px;
      display: flex; align-items: center; gap: 7px;
      color: var(--text); background: transparent; border: 1px solid transparent;
      border-radius: 5px; text-align: left; cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    #galaxy-name-button:hover, #galaxy-name-button:focus-visible {
      background: rgba(139,92,246,0.12); border-color: var(--accent-border);
      outline: none;
    }
    #galaxy-name-button .edit-icon { opacity: 0; flex-shrink: 0; font-size: 12px; color: var(--accent-light); }
    #galaxy-name-button:hover .edit-icon, #galaxy-name-button:focus-visible .edit-icon { opacity: 0.8; }
    #galaxy-name-input {
      width: 100%; padding: 2px 6px; margin: -3px -6px;
      font: 600 20px 'Cormorant Garamond', serif; color: var(--text);
      background: rgba(139,92,246,0.12); border: 1px solid var(--accent-light);
      border-radius: 5px; outline: none;
    }
    #galaxy-name-status { min-height: 14px; margin-top: 4px; font-size: 11px; color: var(--text-sub); }
    #galaxy-name-status.error { color: #fca5a5; }

    /* Chat */
    .chat-wrap {
      flex: 1; overflow-y: auto;
      padding: 20px 16px 32px;
      display: flex; flex-direction: column;
    }
    .chat-wrap::-webkit-scrollbar { width: 3px; }
    .chat-wrap::-webkit-scrollbar-thumb { background: var(--accent-border); border-radius: 2px; }

    /* ── Chat elements ── */
    .lmsg { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
    .av {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: rgba(255,255,255,0.85);
      box-shadow: 0 0 14px rgba(109,40,217,0.4); margin-top: 2px;
    }
    .lbubble {
      background: var(--accent-dim);
      border: 1px solid rgba(139,92,246,0.18);
      border-radius: 3px 14px 14px 14px;
      padding: 11px 15px; font-size: 13px; line-height: 1.75;
      color: rgba(237,233,248,0.82); max-width: 90%;
    }
    .lbubble em { color: var(--accent-light); font-style: italic; }
    .err-bubble { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); color: #fca5a5; }

    .typing-dots {
      display: flex; gap: 5px; align-items: center;
      padding: 12px 16px;
      background: rgba(139,92,246,0.07);
      border: 1px solid rgba(139,92,246,0.12);
      border-radius: 3px 14px 14px 14px;
    }
    .typing-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(139,92,246,0.55);
      animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .umsg { display: flex; margin-bottom: 14px; justify-content: flex-end; }
    .ububble {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px 3px 14px 14px;
      padding: 10px 15px; font-size: 13px;
      color: rgba(255,255,255,0.6); max-width: 80%;
    }

    .chips-wrap { margin: 2px 0 14px 38px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 16px; border-radius: 24px;
      background: rgba(139,92,246,0.07);
      border: 1px solid rgba(139,92,246,0.22);
      font-size: 12px; color: rgba(196,181,253,0.7);
      cursor: pointer; transition: all 0.18s;
    }
    .chip:hover { background: rgba(139,92,246,0.15); border-color: rgba(139,92,246,0.45); color: var(--accent-light); }
    .chip.on { background: rgba(139,92,246,0.22); border-color: rgba(139,92,246,0.55); color: #ddd6fe; }

    .ch-card {
      margin: 4px 0 10px 38px;
      border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(139,92,246,0.15);
      background: rgba(139,92,246,0.05);
      backdrop-filter: blur(4px);
    }
    .ch-head {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .ch-num { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(196,181,253,0.4); margin-bottom: 2px; }
    .ch-title { font-size: 13px; color: rgba(237,233,254,0.85); font-weight: 400; }
    .ch-photos { padding: 10px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .ch-ph {
      width: 48px; height: 48px; border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(139,92,246,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: rgba(255,255,255,0.18);
      cursor: pointer; overflow: hidden; flex-shrink: 0;
      transition: border-color 0.2s, background 0.2s;
    }
    .ch-ph:hover { border-color: var(--accent-border); background: rgba(139,92,246,0.08); }
    .ch-ph img { width: 100%; height: 100%; object-fit: cover; }
    .ch-hook-input {
      display: block; width: 100%; box-sizing: border-box;
      padding: 8px 14px 10px;
      font-size: 12px; font-family: 'Georgia', serif; font-style: italic;
      color: rgba(196,181,253,0.75); line-height: 1.6;
      background: transparent; border: none; border-top: 1px solid rgba(139,92,246,0.08);
      resize: none; outline: none; min-height: 52px;
    }
    .ch-hook-input::placeholder { color: rgba(196,181,253,0.25); }
    .ch-hook-input:focus { color: rgba(196,181,253,1); border-top-color: rgba(139,92,246,0.3); }

    .action-row { margin: 4px 0 18px 38px; display: flex; gap: 9px; }
    .btn-next {
      padding: 10px 22px; border-radius: 24px;
      background: rgba(139,92,246,0.15);
      border: 1px solid rgba(139,92,246,0.35);
      font-size: 13px; font-family: 'Jost', sans-serif;
      color: rgba(196,181,253,0.95); cursor: pointer; transition: all 0.18s;
    }
    .btn-next:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-next:not(:disabled):hover { background: rgba(139,92,246,0.28); }
    .btn-next.done { background: rgba(110,231,183,0.12); border-color: rgba(110,231,183,0.32); color: rgba(110,231,183,0.95); }

    .btn-yesno { margin: 4px 0 16px 38px; display: flex; gap: 9px; }
    .btn-yes {
      padding: 10px 22px; border-radius: 24px;
      background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.3);
      font-size: 13px; font-family: 'Jost', sans-serif;
      color: rgba(196,181,253,0.85); cursor: pointer; transition: all 0.18s;
    }
    .btn-yes:hover { background: rgba(139,92,246,0.22); }
    .btn-no {
      padding: 10px 18px; border-radius: 24px;
      background: transparent; border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px; font-family: 'Jost', sans-serif;
      color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.18s;
    }
    .btn-no:hover { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); }

    .done-note { font-size: 11px; color: rgba(255,255,255,0.28); display: block; margin-top: 5px; }

    /* Mobile */
    @media (max-width: 640px) {
      body { flex-direction: column; }
      #preview-pane { height: 35vh; flex: none; }
      #story-panel { width: 100%; height: 65vh; border-left: none; border-top: 1px solid var(--accent-border); }
    }

    /* ── Lumora Story workspace redesign ── */
    :root {
      --panel-w: 430px;
      --story-surface: rgba(8,7,18,.965);
    }
    body { background: #020207; }
    #preview-pane {
      background:
        radial-gradient(circle at 50% 38%, rgba(124,58,237,.2), transparent 33%),
        radial-gradient(circle at 12% 92%, rgba(30,64,175,.09), transparent 28%),
        #030309;
    }
    #preview-pane::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 72%, rgba(0,0,0,.18));
    }
    .story-preview-bar {
      position: absolute;
      z-index: 24;
      top: 22px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .story-preview-brand, .story-preview-step {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 11px;
      color: rgba(255,255,255,.58);
      background: rgba(5,5,13,.58);
      box-shadow: 0 10px 32px rgba(0,0,0,.18);
      backdrop-filter: blur(14px);
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .story-preview-brand strong { color: var(--accent-light); font-size: 13px; }
    .story-preview-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6ee7b7;
      box-shadow: 0 0 0 4px rgba(110,231,183,.1), 0 0 16px rgba(110,231,183,.5);
    }
    #se-center { padding: 70px 40px 36px; }
    #preview-label { margin-bottom: 17px; color: rgba(196,181,253,.45); font-size: 9px; }
    #preview-name { font-size: clamp(34px,4.8vw,68px); text-shadow: 0 0 50px rgba(139,92,246,.28); }
    #se-bottom { padding: 100px clamp(26px,4vw,54px) clamp(28px,4vw,48px); }
    #se-bottom-hook { max-width: 820px; }
    #panel-toggle {
      width: 27px;
      height: 64px;
      border-color: rgba(196,181,253,.18);
      border-radius: 12px 0 0 12px;
      background: rgba(8,7,18,.9);
      box-shadow: -8px 0 28px rgba(0,0,0,.18);
      backdrop-filter: blur(12px);
    }
    #panel-toggle:hover, #panel-toggle:focus-visible {
      outline: none;
      border-color: rgba(196,181,253,.36);
      background: rgba(109,40,217,.3);
    }
    #story-panel {
      z-index: 20;
      border-left-color: rgba(196,181,253,.13);
      background: radial-gradient(circle at 88% 0%, rgba(124,58,237,.14), transparent 28%), var(--story-surface);
      box-shadow: -24px 0 80px rgba(0,0,0,.22);
      transition: width .32s cubic-bezier(.22,1,.36,1), border-color .3s ease;
    }
    #story-panel.collapsed .panel-header,
    #story-panel.collapsed .chat-wrap { opacity: 0; pointer-events: none; }
    .panel-header {
      padding: 20px 24px 18px;
      border-bottom-color: rgba(255,255,255,.065);
      background: rgba(255,255,255,.012);
    }
    .story-panel-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      margin: 0;
      color: rgba(255,255,255,.38);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .back-btn:hover, .back-btn:focus-visible { color: var(--accent-light); outline: none; }
    .story-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 29px;
      padding: 5px 9px;
      border: 1px solid rgba(167,139,250,.14);
      border-radius: 9px;
      color: rgba(196,181,253,.68);
      background: rgba(139,92,246,.055);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .header-eyebrow { margin-bottom: 7px; opacity: 1; font-size: 9px; }
    #galaxy-name-button { padding: 4px 7px; margin: -4px -7px; border-radius: 9px; }
    #galaxy-name, #galaxy-name-input { font-size: 27px; line-height: 1.1; }
    #galaxy-name-input {
      min-height: 42px;
      padding: 5px 8px;
      margin: -4px -7px;
      border-radius: 9px;
      background: rgba(139,92,246,.1);
    }
    #galaxy-name-status { margin-top: 7px; }
    .chat-wrap {
      padding: 22px 22px 40px;
      scrollbar-color: rgba(139,92,246,.3) transparent;
    }
    .chat-intro {
      margin: 0 0 22px;
      padding: 15px 16px;
      border: 1px solid rgba(196,181,253,.09);
      border-radius: 14px;
      color: rgba(255,255,255,.36);
      background: rgba(255,255,255,.018);
      font-size: 11px;
      line-height: 1.55;
    }
    .lmsg, .umsg { margin-bottom: 16px; }
    .av {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(145deg,#8b5cf6,#5b21b6);
      box-shadow: 0 7px 18px rgba(109,40,217,.22);
    }
    .lbubble {
      max-width: calc(100% - 38px);
      padding: 12px 15px;
      border-color: rgba(167,139,250,.13);
      border-radius: 4px 14px 14px 14px;
      background: rgba(139,92,246,.075);
      font-size: 12px;
      line-height: 1.65;
    }
    .ububble {
      padding: 10px 14px;
      border-color: rgba(255,255,255,.08);
      border-radius: 14px 4px 14px 14px;
      background: rgba(255,255,255,.045);
      color: rgba(255,255,255,.62);
      font-size: 12px;
    }
    .typing-dots { border-radius: 4px 14px 14px 14px; }
    .chips-wrap {
      margin: 2px 0 18px 40px;
      gap: 7px;
    }
    .chip {
      min-height: 38px;
      padding: 8px 14px;
      border-radius: 11px;
      color: rgba(196,181,253,.76);
      background: rgba(139,92,246,.06);
      font: 400 11px 'Jost',sans-serif;
    }
    .chip:hover, .chip:focus-visible {
      outline: none;
      color: #fff;
      border-color: rgba(167,139,250,.42);
      background: rgba(139,92,246,.14);
    }
    .chip.on { color: #fff; background: rgba(139,92,246,.22); }
    .ch-card {
      margin: 5px 0 11px 40px;
      border-color: rgba(196,181,253,.11);
      border-radius: 15px;
      background: rgba(255,255,255,.022);
      box-shadow: 0 14px 34px rgba(0,0,0,.1);
    }
    .ch-head { padding: 12px 14px; }
    .ch-head:hover, .ch-head:focus-visible { outline: none; background: rgba(139,92,246,.045); }
    .ch-num { color: rgba(196,181,253,.48); }
    .ch-photos { padding: 12px 14px; gap: 8px; }
    .ch-ph {
      width: 54px;
      height: 54px;
      border-color: rgba(167,139,250,.2);
      border-radius: 10px;
      color: var(--accent-light);
      background: rgba(139,92,246,.035);
    }
    .ch-ph:hover, .ch-ph:focus-visible { outline: none; border-color: rgba(167,139,250,.48); background: rgba(139,92,246,.1); }
    .ch-hook-input {
      min-height: 64px;
      padding: 11px 14px 13px;
      border-top-color: rgba(255,255,255,.055);
      color: rgba(221,214,254,.78);
    }
    .ch-hook-input:focus { border-top-color: rgba(167,139,250,.35); background: rgba(139,92,246,.025); }
    .action-row, .btn-yesno { margin-left: 40px; }
    .btn-next, .btn-yes, .btn-no {
      min-height: 40px;
      padding: 9px 17px;
      border-radius: 11px;
      font-size: 11px;
    }
    .btn-next:not(:disabled):hover, .btn-next:not(:disabled):focus-visible,
    .btn-yes:hover, .btn-yes:focus-visible,
    .btn-no:hover, .btn-no:focus-visible { outline: none; }
    @media (max-width: 900px) {
      :root { --panel-w: 390px; }
      .story-preview-brand span:last-child { display: none; }
    }
    @media (max-width: 640px) {
      html, body { height: 100%; height: 100dvh; }
      #preview-pane { height: 34dvh; min-height: 190px; flex: none; }
      #preview-pane::after { background: linear-gradient(180deg,transparent 65%,rgba(0,0,0,.25)); }
      #story-panel {
        width: 100%;
        height: 66dvh;
        min-height: 0;
        border-left: 0;
        border-top-color: rgba(196,181,253,.13);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -20px 60px rgba(0,0,0,.28);
      }
      #story-panel.collapsed { width: 100%; }
      #panel-toggle { display: none; }
      .story-preview-bar { top: 14px; left: 14px; }
      .story-preview-brand, .story-preview-step { min-height: 30px; padding: 6px 9px; font-size: 8px; }
      #se-center { padding: 58px 20px 24px; }
      #preview-name { font-size: 34px; }
      #preview-occasion { margin-bottom: 25px; }
      #se-bottom { padding: 70px 20px 22px; }
      #se-bottom-hook { font-size: 16px; }
      .panel-header { padding: 15px 18px 14px; }
      .story-panel-nav { margin-bottom: 11px; }
      #galaxy-name, #galaxy-name-input { font-size: 23px; }
      .chat-wrap { padding: 18px 16px 32px; }
      .chat-intro { margin-bottom: 18px; }
      .chips-wrap, .ch-card, .action-row, .btn-yesno { margin-left: 38px; }
    }
    @media (max-width: 390px) {
      .chips-wrap, .ch-card, .action-row, .btn-yesno { margin-left: 0; }
      .ch-card { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      #story-panel, .preview-photo-bg, .se-star, .se-pulse { transition: none; animation: none; }
    }
  </style>
</head>
<body>

  <!-- SE Visual Preview -->
  <div id="preview-pane">
    <div id="preview-photos"></div>
    <canvas id="se-canvas"></canvas>
    <div class="story-preview-bar" aria-hidden="true">
      <div class="story-preview-brand"><strong>✦</strong><span data-i18n="storySetupPreviewLabel">Lumora · Xem trước</span></div>
      <div class="story-preview-step"><span class="story-preview-dot"></span><span data-i18n="storySetupGuided">Dẫn chuyện</span></div>
    </div>
    <div id="se-bottom">
      <div id="se-bottom-label"></div>
      <div id="se-bottom-hook"></div>
    </div>
    <div id="se-center">
      <div id="preview-label" data-i18n="storySetupPreviewTitle">✦ Story Experience</div>
      <div id="preview-name">—</div>
      <div id="preview-occasion"></div>
      <div class="se-pulse-wrap">
        <div class="se-pulse"></div>
      </div>
    </div>
    <button id="panel-toggle" type="button" aria-label="Ẩn bảng Story" title="Ẩn bảng Story" data-i18n-label="storySetupPanelHide" data-i18n-title="storySetupPanelHide" data-track-action="Story Panel Toggle" data-track-id="story_panel_toggle" aria-expanded="true">◀</button>
  </div>

  <!-- Chat Panel -->
  <div id="story-panel">
    <div class="panel-header">
      <div class="story-panel-nav">
        <a id="back-link" href="/portal/" class="back-btn" data-track-action="Story Back Click" data-track-id="story_back"><span aria-hidden="true">←</span> <span data-i18n="storySetupBack">Thiết lập vũ trụ</span></a>
        <span class="story-mode-badge"><span aria-hidden="true">✦</span><span data-i18n="storySetupMode">Story guide</span></span>
      </div>
      <div class="header-eyebrow" data-i18n="storySetupKicker">Không gian kể chuyện</div>
      <button id="galaxy-name-button" type="button" aria-label="Đổi tên vũ trụ" data-i18n-label="setupRenameLabel" data-track-action="Story Rename Open" data-track-id="story_rename_open">
        <span id="galaxy-name" data-i18n="setupLoading">Đang tải…</span><span class="edit-icon" aria-hidden="true">✎</span>
      </button>
      <input id="galaxy-name-input" type="text" aria-label="Tên vũ trụ" data-i18n-label="setupNameLabel" autocomplete="off" hidden />
      <div id="galaxy-name-status" role="status" aria-live="polite"></div>
    </div>
    <div class="chat-wrap" id="chat">
      <div class="chat-intro" data-i18n="storySetupIntro">Lumora sẽ dẫn bạn qua từng bước để biến những bức ảnh thành một câu chuyện có cảm xúc.</div>
    </div>
  </div>

  <script src="/shared/js/i18n.js"></script>
  <script>
    document.documentElement.lang = userLang;
    document.title = t.storySetupPageTitle || document.title;
    document.querySelectorAll('[data-i18n]').forEach(function (node) {
      const value = t[node.dataset.i18n];
      if (typeof value === 'string') node.textContent = value;
    });
    document.querySelectorAll('[data-i18n-label]').forEach(function (node) {
      const value = t[node.dataset.i18nLabel];
      if (typeof value === 'string') node.setAttribute('aria-label', value);
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function (node) {
      const value = t[node.dataset.i18nTitle];
      if (typeof value === 'string') node.title = value;
    });

    // ── CSS Stars ──────────────────────────────────────────
    const pane = document.getElementById('preview-pane');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'se-star';
      const sz = Math.random() * 1.8 + 0.3;
      s.style.cssText = `
        width:${sz}px;height:${sz}px;
        left:${Math.random()*100}%;top:${Math.random()*100}%;
        --d:${2+Math.random()*5}s;
        --min:${0.03+Math.random()*0.06};
        --max:${0.25+Math.random()*0.4};
        animation-delay:${Math.random()*5}s;
      `;
      pane.appendChild(s);
    }

    // ── Firefly effect ─────────────────────────────────────
    const canvas = document.getElementById('se-canvas');
    canvas.width  = pane.offsetWidth;
    canvas.height = pane.offsetHeight;
    new ResizeObserver(() => {
      canvas.width  = pane.offsetWidth;
      canvas.height = pane.offsetHeight;
    }).observe(pane);

    (function runFirefly() {
      const ctx = canvas.getContext('2d');
      const N = 18;
      let flies = [];
      function init() {
        const W = canvas.width, H = canvas.height;
        flies = Array.from({ length: N }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 3.5 + 2,
          vx: (Math.random() - 0.5) * 0.28,
          vy: (Math.random() - 0.5) * 0.28,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.012 + 0.006,
          warm: Math.random() < 0.5,
        }));
      }
      init();
      function draw() {
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        const t = Date.now();
        flies.forEach(f => {
          f.x += f.vx + Math.sin(t * 0.0007 + f.phase) * 0.38;
          f.y += f.vy + Math.cos(t * 0.0008 + f.phase) * 0.32;
          if (f.x < -30) f.x = W + 30;
          if (f.x > W+30) f.x = -30;
          if (f.y < -30) f.y = H + 30;
          if (f.y > H+30) f.y = -30;
          const pulse = 0.45 + 0.55 * Math.sin(t * f.speed * 1000 + f.phase);
          const col = f.warm ? '255,210,110' : '190,150,255';
          const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 3.8);
          grad.addColorStop(0,   `rgba(${col},${(pulse * 0.85).toFixed(2)})`);
          grad.addColorStop(0.4, `rgba(${col},${(pulse * 0.28).toFixed(2)})`);
          grad.addColorStop(1,   `rgba(${col},0)`);
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * 3.8, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ── Preview text update (called from story-setup.js) ───
    window.updateSEPreview = function(type, occasion, galaxyName) {
      if (galaxyName) document.getElementById('preview-name').textContent = galaxyName;
      if (occasion)   document.getElementById('preview-occasion').textContent = occasion.toUpperCase();
    };

    // ── Photo preview: 1 ảnh duy nhất, cross-fade khi đổi chapter ──

    function showSinglePhoto(url) {
      const pane   = document.getElementById('preview-pane');
      const wrap   = document.getElementById('preview-photos');
      const center = document.getElementById('se-center');

      if (!url) {
        pane.classList.remove('has-photo');
        center.style.removeProperty('opacity'); // let CSS take over
        [...wrap.children].forEach(c => { c.style.opacity = '0'; setTimeout(() => c.remove(), 1000); });
        return;
      }

      const div = document.createElement('div');
      div.style.cssText = 'position:absolute;inset:0;opacity:0;transition:opacity 1s ease;';
      const blur = document.createElement('div');
      blur.style.cssText = 'position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px) brightness(0.35);transform:scale(1.08);';
      blur.style.backgroundImage = `url(${url})`;
      const img = document.createElement('img');
      img.src = url;
      img.alt = '';
      img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;';
      div.appendChild(blur);
      div.appendChild(img);
      wrap.appendChild(div);

      pane.classList.add('has-photo');
      center.style.removeProperty('opacity'); // CSS class handles hiding

      requestAnimationFrame(() => requestAnimationFrame(() => {
        div.style.opacity = '0.9';
        [...wrap.children].forEach(c => {
          if (c === div) return;
          c.style.opacity = '0';
          setTimeout(() => c.remove(), 1100);
        });
      }));
    }

    // Slideshow only when chapter has multiple photos
    let _slideTimer = null;
    let _previewGen = 0; // generation counter — cancels stale async calls

    function startChapterPreview(urls) {
      clearInterval(_slideTimer);
      _slideTimer = null;
      if (!urls.length) { showSinglePhoto(null); return; }
      showSinglePhoto(urls[0]);
      if (urls.length > 1) {
        let idx = 0;
        _slideTimer = setInterval(() => {
          idx = (idx + 1) % urls.length;
          showSinglePhoto(urls[idx]);
        }, 3500);
      }
    }

    // From server URLs (sync — always wins over any in-flight async)
    window.setPreviewPhotoUrls = urls => {
      _previewGen++; // invalidate any in-flight setPreviewPhotos call
      startChapterPreview(urls || []);
    };

    // From file select — use FileReader (data: URLs pass CSP; blob: URLs do not)
    window.setPreviewPhotos = async files => {
      const myGen = ++_previewGen;
      const urls = await Promise.all(Array.from(files).map(f => new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(f);
      })));
      if (myGen !== _previewGen) return; // stale — a newer chapter took over
      startChapterPreview(urls);
    };

    // ── Panel toggle ───────────────────────────────────────
    document.getElementById('panel-toggle').onclick = function() {
      const panel = document.getElementById('story-panel');
      const collapsed = panel.classList.toggle('collapsed');
      this.textContent = collapsed ? '▶' : '◀';
      this.setAttribute('aria-expanded', String(!collapsed));
      this.setAttribute('aria-label', collapsed ? t.storySetupPanelShow : t.storySetupPanelHide);
      this.title = collapsed ? t.storySetupPanelShow : t.storySetupPanelHide;
    };
  </script>
  <script src="/shared/js/activityApi.js"></script>
  <script src="/shared/js/activityLogger.js"></script>
  <script src="/shared/js/trackedFetch.js"></script>
  <script src="/shared/js/activityAutoTracker.js"></script>
  <script type="module" src="./js/story-setup.js"></script>
</body>
</html>
