<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fall Through Memories</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <script src="/shared/js/experienceTransition.js?v=20260816-se2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
    body { background: #000; overflow: hidden; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; height: 100dvh; }

    /* ── Landscape warning ── */
    #landscape-warning {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(ellipse at center, #0a0015 0%, #000 100%);
      flex-direction: column; align-items: center; justify-content: center;
      color: white; text-align: center; padding: 24px;
    }
    body.portrait-mode #landscape-warning { display: flex; }
    .rotate-icon {
      width: 60px; height: 60px; border: 3px solid rgba(255,255,255,0.5);
      border-radius: 12px; margin-bottom: 24px;
      animation: rotateHint 2s ease-in-out infinite;
    }
    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(90deg); }
    }

    /* ── Intro overlay ── */
    #intro {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0a0015 0%, #000 100%);
      cursor: pointer; transition: opacity 0.8s ease;
    }
    #intro.hidden { opacity: 0; pointer-events: none; }
    #intro-title {
      font-size: clamp(28px, 6vw, 56px);
      color: #fff;
      letter-spacing: 0.12em;
      font-weight: 300;
      margin-bottom: 12px;
      text-align: center;
    }
    #intro-sub {
      font-size: 14px; color: rgba(255,255,255,0.45);
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 48px;
    }
    .pulse-ring {
      width: 64px; height: 64px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2);   opacity: 0; }
    }
    .tap-hint {
      margin-top: 20px; font-size: 13px;
      color: rgba(255,255,255,0.35); letter-spacing: 0.1em;
    }

    /* ── Audio button ── */
    #btn-audio {
      position: fixed; top: calc(20px + env(safe-area-inset-top)); right: calc(20px + env(safe-area-inset-right)); z-index: 200;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    #btn-audio:hover { background: rgba(255,255,255,0.15); }
    #btn-audio.hidden { display: none; }
  </style>
  <script>
    // Bộ chặn quảng cáo nuốt được một tệp script trong khi server vẫn trả 200:
    // không log, không lỗi phía ta, người dùng chỉ thấy màn hình đen. Đã xảy ra
    // thật với scene/beacon.js (luật `/beacon.js` của EasyPrivacy). Sự kiện lỗi
    // tải tài nguyên KHÔNG nổi bọt, nên phải nghe ở pha capture.
    //
    // Đoạn này BẮT BUỘC nội tuyến — một tệp .js riêng cũng bị chặn y như vậy.
    // `tests/adblock-assets.test.js` lo phần phòng ngừa; đây là lưới an toàn cho
    // luật mới hoặc danh sách lọc tự chế mà ta không biết trước.
    addEventListener('error', function (e) {
      var el = e.target;
      if (!el || el === window || el.tagName !== 'SCRIPT') return;
      // CHỈ script CÙNG NGUỒN. Cloudflare tự chèn
      // static.cloudflareinsights.com/beacon.min.js vào mọi trang, và CSP của
      // chính ta chặn nó — không liên quan gì tới Lumora, nhưng bản đầu của
      // đoạn này vẫn hô hoán "hãy tắt bộ chặn quảng cáo" với MỌI khách trên
      // production. Cảnh báo sai còn tệ hơn không cảnh báo: nó dạy người dùng
      // bỏ qua cảnh báo thật.
      //
      // Script cùng nguồn hỏng thì mới thật sự giết trang, vì đó là mã của ta.
      try { if (new URL(el.src, location.href).origin !== location.origin) return; }
      catch (err) { return; }
      var bao = document.getElementById('lumora-chan-tep') || document.createElement('div');
      bao.id = 'lumora-chan-tep';
      bao.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:14px 18px;background:#8a3a30;color:#e8dccc;font:14px/1.6 system-ui,sans-serif;text-align:center';
      // KHÔNG nêu el.src như "tệp bị chặn": với module, sự kiện lỗi nổi lên ở thẻ
      // script GỐC, còn tệp bị nuốt là một import nằm sâu bên trong. Nêu sai tên
      // còn tệ hơn không nêu. URL cất vào data- để còn truy khi cần.
      bao.dataset.script = el.src || '';
      bao.textContent = 'Một tiện ích mở rộng của trình duyệt đang chặn tệp script của Lumora nên trang không chạy được. Hãy tắt bộ chặn quảng cáo cho trang này rồi tải lại.';
      if (document.body) document.body.appendChild(bao);
      else addEventListener('DOMContentLoaded', function () { document.body.appendChild(bao); });
    }, true);
  </script>
</head>
<body>
  <script>
    try {
      window.lumoraArrivalTransition = window.LumoraExperienceTransition.bootstrapArrival({
        storage: window.sessionStorage,
        galaxyId: new URLSearchParams(location.search).get('galaxyId'),
        document,
      });
    } catch {
      window.lumoraArrivalTransition = null;
    }
  </script>
  <div id="canvas-container"></div>

  <div id="landscape-warning">
    <div class="rotate-icon"></div>
    <h1 style="font-size:1.4em;margin-bottom:8px">Fall Through Memories</h1>
    <p style="font-size:0.85em;opacity:0.6;margin-top:8px">Xoay ngang màn hình để có trải nghiệm tốt nhất</p>
  </div>

  <div id="intro">
    <div id="intro-title">Fall Through Memories</div>
    <div id="intro-sub">Rơi xuyên qua ký ức</div>
    <div class="pulse-ring"></div>
    <div class="tap-hint">Chạm để bắt đầu</div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('autostart') === 'true') {
      document.getElementById('intro').style.display = 'none';
    }
  </script>

  <button id="btn-audio" class="hidden">🔇</button>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
      "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>

  <script src="/shared/js/activityApi.js"></script>
  <script src="/shared/js/activityLogger.js"></script>
  <script src="/shared/js/trackedFetch.js"></script>
  <script src="/shared/js/activityAutoTracker.js"></script>
  <script src="/shared/js/soundscapeEngine.js?v=20260815-dynamic1"></script>
    <script src="/shared/js/storyEmotionEngine.js?v=20260816-scene-grammar1"></script>
  <script>
    const musicManager = window.LumoraSoundscape.createManager({ buttonId: 'btn-audio', hiddenClass: 'hidden' });
    window.musicManager = musicManager;

    // ── Orientation check ──────────────────────────
    function checkOrientation() {
      const isPortrait = window.innerHeight > window.innerWidth && 'ontouchstart' in window;
      document.body.classList.toggle('portrait-mode', isPortrait);
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 200));
    checkOrientation();
  </script>

  <script src="/shared/js/lumoraDebug.js?v=20260821-2"></script>
  <script type="module" src="./js/fall.js?v=20260903-tier1"></script>
</body>
</html>
