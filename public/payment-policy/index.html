<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chính sách thanh toán — Lumora</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/shared/css/legal.css"></head>
<body class="legal-page" data-title-vi="Chính sách thanh toán — Lumora" data-title-en="Payment Policy — Lumora">
  <nav class="legal-nav"><a href="/">✦ Lumora</a><a href="/support/?type=payment" data-vi="Hỗ trợ thanh toán" data-en="Payment support"></a></nav>
  <main class="legal-container">
    <h1 data-vi="Chính sách thanh toán" data-en="Payment Policy"></h1><p class="legal-lead" data-vi="Cập nhật lần cuối: 11/08/2026" data-en="Last updated: 11/08/2026"></p>
    <h2 data-vi="1. Phương thức và đơn vị thanh toán" data-en="1. Payment method and currency"></h2><p data-vi="Lumora sử dụng PayOS để tạo trang thanh toán và xử lý trạng thái giao dịch. Mọi mức giá được niêm yết và thanh toán bằng đồng Việt Nam (VND)." data-en="Lumora uses PayOS to create the checkout page and process transaction status. All prices are listed and paid in Vietnamese dong (VND)."></p>
    <h2 data-vi="2. Gói và kỳ sử dụng" data-en="2. Plans and service terms"></h2><p data-vi="Mỗi giao dịch mua một kỳ sử dụng tháng hoặc năm cho gói đã chọn. Lumora không tự động trừ tiền và không tự động gia hạn. Khi hết hạn, người dùng chủ động tạo giao dịch mới nếu muốn tiếp tục." data-en="Each transaction purchases one monthly or yearly service term for the selected plan. Lumora does not charge or renew automatically. At expiry, users create a new transaction if they wish to continue."></p><div data-public-plan-list></div>
    <p class="legal-notice" data-config-row hidden><span data-tax-notice></span></p><p class="legal-notice" data-missing-notice="taxNotice" data-vi="Thông tin thuế/phí đang chờ chủ quản xác nhận; chức năng thanh toán được khóa trong thời gian này." data-en="Tax and fee information is awaiting owner confirmation; payments remain disabled in the meantime."></p>
    <h2 data-vi="3. Xác nhận và kích hoạt" data-en="3. Confirmation and activation"></h2><p data-vi="Trước khi chuyển sang PayOS, người dùng được rà soát gói, kỳ, giá, thời hạn và phải chủ động đồng ý điều khoản. Gói được kích hoạt hoặc gia hạn sau khi Lumora nhận và xác minh trạng thái thanh toán thành công từ PayOS." data-en="Before proceeding to PayOS, users review the plan, term, price, and validity period and must actively accept the terms. The plan is activated or extended after Lumora receives and verifies a successful payment status from PayOS."></p>
    <h2 data-vi="4. Trạng thái giao dịch" data-en="4. Transaction statuses"></h2><ul><li><strong data-vi="Chờ thanh toán:" data-en="Pending:"></strong> <span data-vi="yêu cầu đã tạo nhưng chưa có xác nhận thành công." data-en="the request was created but has not been confirmed as successful."></span></li><li><strong data-vi="Đã thanh toán:" data-en="Paid:"></strong> <span data-vi="PayOS xác nhận thành công và Lumora đã xử lý quyền sử dụng." data-en="PayOS confirmed success and Lumora processed the service entitlement."></span></li><li><strong data-vi="Đã hủy:" data-en="Cancelled:"></strong> <span data-vi="giao dịch chưa hoàn tất đã được hủy." data-en="an incomplete transaction was cancelled."></span></li><li><strong data-vi="Thất bại:" data-en="Failed:"></strong> <span data-vi="không thể tạo hoặc hoàn tất yêu cầu thanh toán." data-en="the payment request could not be created or completed."></span></li></ul>
    <h2 data-vi="5. Tra cứu và hỗ trợ" data-en="5. History and support"></h2><p><span data-vi="Người dùng có thể xem lịch sử trong tab Subscription. Nếu tài khoản đã bị trừ tiền nhưng gói chưa kích hoạt, hãy gửi yêu cầu tại" data-en="Users can view their history in the Subscription tab. If an account was charged but the plan was not activated, submit a request through the"></span> <a href="/support/?type=payment" data-vi="trang hỗ trợ" data-en="support page"></a> <span data-vi="và cung cấp mã đơn hàng." data-en="and provide the order code."></span></p>
  </main>
