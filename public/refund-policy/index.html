  <main class="legal-container">
    <h1 data-vi="Chính sách hủy và hoàn tiền" data-en="Cancellation and Refund Policy"></h1><p class="legal-lead" data-vi="Cập nhật lần cuối: 11/08/2026" data-en="Last updated: 11/08/2026"></p>
    <h2 data-vi="1. Các hành động khác nhau" data-en="1. Different actions"></h2><ul><li><strong data-vi="Hủy yêu cầu chưa hoàn tất:" data-en="Cancel an incomplete request:"></strong> <span data-vi="kết thúc một giao dịch đang chờ; không phát sinh kỳ sử dụng." data-en="ends a pending transaction; no service term begins."></span></li><li><strong data-vi="Không mua kỳ tiếp theo:" data-en="Do not purchase another term:"></strong> <span data-vi="không cần thao tác hủy tự động vì Lumora không tự động gia hạn." data-en="no cancellation action is needed because Lumora does not renew automatically."></span></li><li><strong data-vi="Chấm dứt sử dụng:" data-en="Stop using the service:"></strong> <span data-vi="ngừng sử dụng tài khoản hoặc gửi yêu cầu xử lý dữ liệu qua kênh hỗ trợ." data-en="stop using the account or submit a data-handling request through support."></span></li><li><strong data-vi="Yêu cầu hoàn tiền:" data-en="Request a refund:"></strong> <span data-vi="được tiếp nhận và xem xét theo từng trường hợp." data-en="is received and reviewed case by case."></span></li></ul>
    <h2 data-vi="2. Trường hợp được tiếp nhận xem xét" data-en="2. Cases accepted for review"></h2><ul><li data-vi="Thanh toán trùng." data-en="Duplicate payment."></li><li data-vi="PayOS báo thành công nhưng Lumora không kích hoạt gói." data-en="PayOS reports success but Lumora does not activate the plan."></li><li data-vi="Lumora không cung cấp được dịch vụ trả phí do lỗi hệ thống kéo dài." data-en="Lumora cannot provide the paid service because of a prolonged system error."></li><li data-vi="Giao dịch không được chủ tài khoản cho phép." data-en="A transaction was not authorized by the account owner."></li><li data-vi="Trường hợp khác theo quy định pháp luật áp dụng." data-en="Other cases required by applicable law."></li></ul>
    <h2 data-vi="3. Cách gửi yêu cầu" data-en="3. How to submit a request"></h2><p><span data-vi="Gửi yêu cầu tại" data-en="Submit a request through the"></span> <a href="/support/?type=refund" data-vi="trang hỗ trợ" data-en="support page"></a><span data-vi=", chọn “Hoàn tiền”, ghi mã đơn hàng và mô tả sự việc. Có thể cần cung cấp bằng chứng giao dịch và thông tin cần thiết để xác minh quyền sở hữu; Lumora không yêu cầu tải ảnh CCCD vào form này." data-en=", select “Refund”, and include the order code and a description. Transaction evidence and information needed to verify ownership may be required; Lumora does not ask you to upload an identity-card image through this form."></span></p>
    <h2 data-vi="4. Xử lý và phương thức hoàn tiền" data-en="4. Processing and refund method"></h2><p data-vi="Lumora sẽ tiếp nhận, xác minh, thông báo kết quả và hướng dẫn phương thức hoàn tiền phù hợp." data-en="Lumora will receive and verify the request, communicate the outcome, and provide instructions for the appropriate refund method."></p><p class="legal-notice" data-config-row hidden><span data-refund-timeline-notice></span></p><p class="legal-notice" data-config-row hidden><span data-refund-method-notice></span></p><p class="legal-notice" data-missing-notice="refundTimelineNotice" data-vi="Thời hạn xử lý đang chờ chủ quản phê duyệt; chức năng thanh toán được khóa trong thời gian này." data-en="The processing timeframe is awaiting owner approval; payments remain disabled in the meantime."></p><p class="legal-notice" data-missing-notice="refundMethodNotice" data-vi="Phương thức hoàn tiền đang chờ chủ quản phê duyệt; chức năng thanh toán được khóa trong thời gian này." data-en="The refund method is awaiting owner approval; payments remain disabled in the meantime."></p>
