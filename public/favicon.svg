<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="lumora-mark">
  <title id="lumora-mark">Lumora</title>
  <!--
    Giữ nguyên hình ✦ như cũ, chỉ đổi màu sang bảng sơn mài.

    Một thay đổi KHÔNG phải thẩm mỹ: bản cũ vẽ ✦ bằng thẻ <text>. Favicon
    render ngoài ngữ cảnh trang nên không có font nào được bảo đảm — máy
    thiếu font chứa U+2726 sẽ ra ô vuông tofu, và cỡ chữ giữa các font cũng
    lệch nhau. Ở đây là cùng hình sao bốn cánh cạnh lõm đó, nhưng vẽ bằng
    đường nên hiện giống hệt nhau ở mọi máy.
  -->
  <rect width="100" height="100" fill="#0c0b0a"/>
  <path d="M50 26 Q54.1 45.9 74 50 Q54.1 54.1 50 74 Q45.9 54.1 26 50 Q45.9 45.9 50 26 Z" fill="#b99a5e"/>
</svg>
