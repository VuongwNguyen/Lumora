<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Galaxy</title>
    <link rel="icon" type="image/png" href="/heart.png" sizes="16x16" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Importmap cho THREE.js -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/FontLoader.js": "https://unpkg.com/three@0.152.2/examples/jsm/loaders/FontLoader.js",
        "three/examples/jsm/geometries/TextGeometry.js": "https://unpkg.com/three@0.152.2/examples/jsm/geometries/TextGeometry.js"
      }
    }
  </script>
    <script src="/shared/js/experienceTransition.js?v=20260816-se2"></script>

    <style>
        .text-white {
            color: white !important;
        }

        .btn-audio-toggle {
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .music-status {
            display: flex;
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            z-index: 9999;
            align-items: center;
            font-family: sans-serif;
            font-size: 14px;
        }

        .music-status .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #a259f7;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        body.portrait-mode #landscape-warning {
            display: flex;
            opacity: 1;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
    </style>
</head>

<body>
    <script>
        try {
            window.lumoraArrivalTransition = window.LumoraExperienceTransition.bootstrapArrival({
                storage: window.sessionStorage,
                galaxyId: new URLSearchParams(location.search).get('galaxyId'),
                document,
            });
        } catch {
            window.lumoraArrivalTransition = null;
        }
    </script>
    <div id="container"></div>

    <div id="landscape-warning">
        <div class="warning-content">
            <div class="rotate-icon"></div>
            <h1>Love</h1>
            <h1>Tinh Cầu</h1>
            <p style="font-size: 0.6em;">Cậu hãy xoay ngang màn hình nha để thấy điều kỳ diệu!</p>
            <p style="font-size: 0.6em;">Nhớ chạm vào tinh cầu ở giữa để mở quà bí mật nha.</p>
            <div class="stars-bg"></div>
        </div>
    </div>

    <div id="dark-overlay"></div>
    <div id="info"></div>

    <!-- Audio Control Button -->
    <button id="toggle-audio" class="btn-audio-toggle" style="position: fixed; top: 20px; right: 20px; z-index: 10000; background: rgba(0,0,0,0.7); border: none; border-radius: 50%; width: 50px; height: 50px; color: white; font-size: 20px; cursor: pointer;">
        <i id="audio-icon" class="fas fa-volume-xmark"></i>
    </button>

    <script>
        window.dataLove2Loveloom = {
            template: "galaxy",
            data: {
                keychain: { name: "Loveloom", phone: "Loveloom", address: "Loveloom" },
                ringTexts: [], // populated from galaxy.caption via script.js
            }
        };
    </script>

    <script src="/shared/js/activityApi.js"></script>
    <script src="/shared/js/activityLogger.js"></script>
    <script src="/shared/js/trackedFetch.js"></script>
    <script src="/shared/js/activityAutoTracker.js"></script>
    <!-- Shared original Web Audio soundscape engine -->
    <script src="/shared/js/soundscapeEngine.js?v=20260815-mobile2"></script>
    <script src="/shared/js/storyEmotionEngine.js?v=20260816-scene-grammar1"></script>
    <script>
        const musicManager = window.LumoraSoundscape.createManager({
            buttonId: 'toggle-audio',
            updateButton(button, isPlaying) {
                const icon = button?.querySelector('#audio-icon');
                if (!icon) return;
                if (isPlaying) {
                    icon.classList.remove('fa-volume-xmark');
                    icon.classList.add('fa-volume-high');
                } else {
                    icon.classList.remove('fa-volume-high');
                    icon.classList.add('fa-volume-xmark');
                }
            },
        });

        window.musicManager = musicManager;
    </script>
  <script src="/shared/js/lumoraDebug.js?v=20260821-2"></script>
    <script type="module" src="./js/script.js?v=20260816-handoff2"></script>
</body>

</html>
