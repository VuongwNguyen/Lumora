    <style>
        .text-white {
            color: white !important;
        }

        .btn-audio-toggle {
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .music-status {
            display: flex;
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            z-index: 9999;
            align-items: center;
            font-family: sans-serif;
            font-size: 14px;
        }

        .music-status .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #a259f7;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        body.portrait-mode #landscape-warning {
            display: flex;
            opacity: 1;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
    </style>
  <script>
    // Bộ chặn quảng cáo nuốt được một tệp script trong khi server vẫn trả 200:
    // không log, không lỗi phía ta, người dùng chỉ thấy màn hình đen. Đã xảy ra
    // thật với scene/beacon.js (luật `/beacon.js` của EasyPrivacy). Sự kiện lỗi
    // tải tài nguyên KHÔNG nổi bọt, nên phải nghe ở pha capture.
    //
    // Đoạn này BẮT BUỘC nội tuyến — một tệp .js riêng cũng bị chặn y như vậy.
    // `tests/adblock-assets.test.js` lo phần phòng ngừa; đây là lưới an toàn cho
    // luật mới hoặc danh sách lọc tự chế mà ta không biết trước.
    addEventListener('error', function (e) {
      var el = e.target;
      if (!el || el === window || el.tagName !== 'SCRIPT') return;
      // CHỈ script CÙNG NGUỒN. Cloudflare tự chèn
      // static.cloudflareinsights.com/beacon.min.js vào mọi trang, và CSP của
      // chính ta chặn nó — không liên quan gì tới Lumora, nhưng bản đầu của
      // đoạn này vẫn hô hoán "hãy tắt bộ chặn quảng cáo" với MỌI khách trên
      // production. Cảnh báo sai còn tệ hơn không cảnh báo: nó dạy người dùng
      // bỏ qua cảnh báo thật.
      //
      // Script cùng nguồn hỏng thì mới thật sự giết trang, vì đó là mã của ta.
      try { if (new URL(el.src, location.href).origin !== location.origin) return; }
      catch (err) { return; }
      var bao = document.getElementById('lumora-chan-tep') || document.createElement('div');
      bao.id = 'lumora-chan-tep';
      bao.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:14px 18px;background:#8a3a30;color:#e8dccc;font:14px/1.6 system-ui,sans-serif;text-align:center';
      // KHÔNG nêu el.src như "tệp bị chặn": với module, sự kiện lỗi nổi lên ở thẻ
      // script GỐC, còn tệp bị nuốt là một import nằm sâu bên trong. Nêu sai tên
      // còn tệ hơn không nêu. URL cất vào data- để còn truy khi cần.
      bao.dataset.script = el.src || '';
      bao.textContent = 'Một tiện ích mở rộng của trình duyệt đang chặn tệp script của Lumora nên trang không chạy được. Hãy tắt bộ chặn quảng cáo cho trang này rồi tải lại.';
      if (document.body) document.body.appendChild(bao);
      else addEventListener('DOMContentLoaded', function () { document.body.appendChild(bao); });
    }, true);
  </script>
</head>

<body>
    <script>
        try {
            window.lumoraArrivalTransition = window.LumoraExperienceTransition.bootstrapArrival({
                storage: window.sessionStorage,
                galaxyId: new URLSearchParams(location.search).get('galaxyId'),
                document,
            });
        } catch {
            window.lumoraArrivalTransition = null;
        }
    </script>

    <!-- Audio Control Button -->

        <i id="audio-icon" class="fas fa-volume-xmark"></i>
    </button>

    <script>
        window.dataLove2Loveloom = {
            template: "galaxy",
            data: {
                keychain: { name: "Loveloom", phone: "Loveloom", address: "Loveloom" },
                ringTexts: [], // populated from galaxy.caption via script.js
            }
        };
    </script>

    <script src="/shared/js/activityApi.js"></script>
    <script src="/shared/js/activityLogger.js"></script>
    <script src="/shared/js/trackedFetch.js"></script>
    <script src="/shared/js/activityAutoTracker.js"></script>
    <!-- Shared original Web Audio soundscape engine -->
    <script src="/shared/js/soundscapeEngine.js?v=20260815-mobile2"></script>
    <script src="/shared/js/storyEmotionEngine.js?v=20260816-scene-grammar1"></script>
    <script>
        const musicManager = window.LumoraSoundscape.createManager({
            buttonId: 'toggle-audio',
            updateButton(button, isPlaying) {
                const icon = button?.querySelector('#audio-icon');
                if (!icon) return;
                if (isPlaying) {
                    icon.classList.remove('fa-volume-xmark');
                    icon.classList.add('fa-volume-high');
                } else {
                    icon.classList.remove('fa-volume-high');
                    icon.classList.add('fa-volume-xmark');
                }
            },
        });

        window.musicManager = musicManager;
    </script>
